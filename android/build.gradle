// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // @capgo/capacitor-social-login (Google only) compiles against browser 1.9.0 while
    // androidbrowserhelper pulls 1.4.0; AGP's consistent resolution then fails the
    // build. Pin one version everywhere.
    configurations.configureEach {
        resolutionStrategy.force 'androidx.browser:browser:1.9.0'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
