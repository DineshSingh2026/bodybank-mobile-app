# Codemagic CI/CD — builds, signs, and ships the iOS app to TestFlight / App Store.
# Runs on a cloud Mac, so nothing here needs macOS on your end.
#
# ONE-TIME SETUP IN THE CODEMAGIC UI (see IOS_SETUP.md for the full walkthrough):
#   1. Connect this Git repo to a Codemagic app.
#   2. Teams → Integrations → App Store Connect: add an API key (Issuer ID, Key ID,
#      .p8 file). Give the integration a name and put that name below where it says
#      <APP_STORE_CONNECT_KEY_NAME>.
#   3. Fill in APP_STORE_APPLE_ID (the numeric Apple ID of the app record you create
#      in App Store Connect — found under App Information → General → Apple ID).
#
# Codemagic auto-creates the signing certificate + provisioning profile from the
# App Store Connect API key (distribution_type: app_store), so you do NOT need to
# generate certificates by hand on a Mac.

workflows:
  # ──────────────────────────────────────────────────────────────────────────
  # Android — auto-build a signed AAB and ship it to the closed-testing track
  # on every push to main. Runs on Linux (no Mac needed).
  #
  # ONE-TIME SETUP IN THE CODEMAGIC UI (see ANDROID_CICD_SETUP.md for the full
  # walkthrough):
  #   1. Connect this Git repo to a Codemagic app (if not already).
  #   2. Code signing identities → Android keystores: upload
  #      bodybank-release.keystore and give it the reference name
  #      `bodybank_keystore` (must match `android_signing` below). Enter the
  #      keystore password, key alias, and key password there.
  #   3. Create a Google Cloud service account with the "Android Publisher" /
  #      Play Console access, download its JSON key, and add it as a secure
  #      env var named GCLOUD_SERVICE_ACCOUNT_CREDENTIALS in a variable group
  #      called `google_play` (matches `groups` below).
  #   4. Set GOOGLE_PLAY_TRACK below to your closed-testing track name (the
  #      track's name in Play Console → Testing → Closed testing; often
  #      `internal` for the Internal testing track, or your custom track name).
  # ──────────────────────────────────────────────────────────────────────────
  android-closed-testing:
    name: BodyBank Android — Closed testing
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - bodybank_keystore        # <-- reference name from Codemagic UI (step 2)
      groups:
        - google_play              # <-- group holding GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (step 3)
      vars:
        PACKAGE_NAME: "com.bodybank.app"
        GOOGLE_PLAY_TRACK: "internal"   # <-- your closed-testing track name (step 4)
      node: 22
      java: 21
    # NO automatic trigger. Android and iOS releases are deliberately separate
    # actions: a git push NEVER starts a build. Start this workflow by hand in the
    # Codemagic UI when you mean to ship Android. (Android currently ships from a
    # local gradlew build + manual Play upload; this workflow is not yet wired up.)
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Capacitor sync Android (copies committed www/ into android/)
        # NOTE: this copies the already-committed www/ snapshot. The web→www
        # mirror (`npm run build:www`) runs locally before you push, because the
        # web repo isn't present on the CI machine.
        script: npx cap sync android
      - name: Write keystore.properties from Codemagic-managed signing
        script: |
          cat > "$CM_BUILD_DIR/android/keystore.properties" <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build signed AAB (unique, increasing versionCode)
        script: |
          cd android
          ANDROID_VERSION_CODE=$(($PROJECT_BUILD_NUMBER + 100)) \
            ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: $GOOGLE_PLAY_TRACK
        # Submits straight to the track (testers get it after Google processes
        # it). Set to true if you'd rather it land as a draft for manual rollout.
        submit_as_draft: false

  ios-appstore:
    name: BodyBank iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: bodybank-appstore   # name of the App Store Connect key in Codemagic Integrations
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bodybank.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6808102656           # numeric Apple ID of the App Store Connect app record
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Capacitor sync iOS (copies www/ into the Xcode project, runs pod install)
        script: npx cap sync ios
      - name: Set build number from Codemagic counter
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Set up provisioning profiles
        script: xcode-project use-profiles
      - name: Build signed .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight on every successful build.
        submit_to_testflight: true
        # When you're ready to push to App Store review, flip this to true (and
        # uncomment) — start with TestFlight-only while you test.
        # submit_to_app_store: false
