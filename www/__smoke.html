<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BodyBank App — Smoke Test</title>
  <script src="/js/bb-app-config.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; background: #0b0b0d; color: #f4f4f5; min-height: 100vh; box-sizing: border-box; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.sub { color: #a1a1aa; margin: 0 0 20px; font-size: 14px; }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14px; }
    .row span:first-child { color: #a1a1aa; }
    .row span:last-child { color: #f4f4f5; text-align: right; word-break: break-all; }
    .ok { color: #4ade80; } .warn { color: #facc15; } .err { color: #f87171; }
    button { background:#c8a44e; color:#0b0b0d; border:none; padding:10px 14px; border-radius:8px; font-weight:600; }
  </style>
</head>
<body>
  <h1>BodyBank — Smoke Test</h1>
  <p class="sub">Reach this page at <code>/__smoke.html</code>. Verifies the WebView + API rewrite.</p>

  <div class="card">
    <div class="row"><span>Platform</span><span id="platform">—</span></div>
    <div class="row"><span>Is native app</span><span id="isApp">—</span></div>
    <div class="row"><span>API base</span><span id="apiBase">—</span></div>
    <div class="row"><span>Origin</span><span id="origin">—</span></div>
  </div>

  <div class="card">
    <p class="sub" style="margin:0 0 8px;">Tap to verify the backend is reachable through the rewrite layer:</p>
    <button id="ping">Ping /api (health)</button>
    <pre id="pingResult" style="margin-top:10px;color:#a1a1aa;font-size:12px;white-space:pre-wrap;">—</pre>
  </div>

  <script>
    document.getElementById('platform').innerHTML = '<span class="ok">' + (window.Capacitor && window.Capacitor.getPlatform ? window.Capacitor.getPlatform() : 'web') + '</span>';
    document.getElementById('isApp').textContent = !!window.IS_BODYBANK_APP;
    document.getElementById('apiBase').textContent = window.API_BASE || '(empty, web mode)';
    document.getElementById('origin').textContent = location.origin;

    document.getElementById('ping').addEventListener('click', async () => {
      const out = document.getElementById('pingResult');
      out.textContent = 'requesting...';
      try {
        const r = await fetch('/api/health', { method: 'GET' });
        out.textContent = 'status=' + r.status + ' ok=' + r.ok + '\nfinal url=' + r.url;
      } catch (e) {
        out.innerHTML = '<span class="err">' + e.message + '</span>';
      }
    });
  </script>
</body>
</html>
